plugins {
    id "com.android.application"
    id "kotlin-android"
    id "com.google.devtools.ksp"
}

android {
    namespace "org.secuso.privacyfriendlybattleship"

    defaultConfig {
        applicationId "org.secuso.privacyfriendlybattleship"
        minSdkVersion 17
        targetSdkVersion 36
        compileSdkVersion 36
        versionCode 100
        versionName "1.2.6"
        vectorDrawables.useSupportLibrary = true

        ksp {
            arg("room.schemaLocation", "$projectDir/schemas")
        }
    }

    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            def appName = "pfa-battleship"
            outputFileName = appName + "-${variant.name}-v${variant.versionName}.apk"
        }
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_21.toString()
    }

    kotlin {
        jvmToolchain(21)
    }

    lint {
        lintConfig = file("lint.xml")
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.preference:preference-ktx:1.2.1'
    testImplementation 'junit:junit:4.13.2'
    // Stuck because of min SDK version 17:
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // Stuck because of min SDK version 17:
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
}
